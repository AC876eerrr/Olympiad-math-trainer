<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Olympiad Math Trainer</title>
<link rel="stylesheet" href="/styles.css">
<script src="/app.js" defer></script>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="/"><span class="logo">Ω</span> Olympiad Math Trainer</a>
    <div class="nav-links">
      <a class="nav-link" href="/login.html">Log in</a>
      <a class="btn btn-primary btn-small" href="/signup.html">Sign up free</a>
    </div>
  </div>
</nav>

<main class="container">
  <form class="form" id="login-form" novalidate>
    <div class="card">
      <h1>Welcome back</h1>
      <p class="sub">Log in to continue training.</p>
      <div id="alert" class="alert-error" style="display:none;"></div>
      <div class="field">
        <label class="label" for="email">Email</label>
        <input class="input" type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label class="label" for="password">Password</label>
        <input class="input" type="password" id="password" name="password" autocomplete="current-password" required placeholder="Your password">
      </div>
      <button class="btn btn-gold" type="submit" id="submit-btn">Log in</button>
      <p class="hint center mt">Password reset via email is not available yet — contact the site owner.</p>
    </div>
    <p class="form-footer">New here? <a href="/signup.html">Create a free account</a></p>
  </form>
</main>

<script>
(function () {
  var form = document.getElementById("login-form");
  var alertBox = document.getElementById("alert");
  var submitBtn = document.getElementById("submit-btn");

  function showError(msg) {
    alertBox.textContent = msg;
    alertBox.style.display = "block";
  }
  function clearError() {
    alertBox.textContent = "";
    alertBox.style.display = "none";
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    clearError();
    var email = document.getElementById("email").value.trim();
    var password = document.getElementById("password").value;

    if (!email || email.indexOf("@") < 0) {
      showError("Please enter a valid email address.");
      return;
    }
    if (!password) {
      showError("Please enter your password.");
      return;
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="spin"></span>Logging in…';
    try {
      await window.App.api("POST", "/api/auth/login", { email: email, password: password });
      location.href = "/app.html";
    } catch (err) {
      showError(err.message);
      submitBtn.disabled = false;
      submitBtn.textContent = "Log in";
    }
  });
})();
</script>

</body>
</html>
